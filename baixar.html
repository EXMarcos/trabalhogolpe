<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>mo.co — Convite Exclusivo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1b1b1b, #2c2c2c);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-image: url('https://mo.co/assets/images/hero-bg.jpg'); /* Substitua pelo caminho da imagem de fundo desejada */
      background-size: cover;
      background-position: center;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      max-width: 500px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #00ffcc;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    .download-button {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 1em;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .download-button:hover {
      background-color: #00ccaa;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.9em;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Convite Exclusivo para mo.co</h1>
    <p>Parabéns! Você foi selecionado para participar da próxima fase de testes do mo.co. Clique no botão abaixo para baixar o instalador.</p>
    <a href="instalador_jogo_moco.zip" download class="download-button">Baixar Instalador</a>
    <div class="footer">
      <p>© 2025 mo.co — Supercell</p>
    </div>

</html>
